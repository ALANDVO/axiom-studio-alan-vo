[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-studio-alan-vo"
version = "1.0.0"
description = "Live open source spatial intelligence simulator and ML trajectory anomaly evaluation platform on a photorealistic 3D globe."
readme = "README.md"
authors = [
    { name = "Alan Vo", email = "alanvo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]
